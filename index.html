<style>
/* Layout: soft neumorphic surfaces. One column; raised cards hold content, pressed wells hold input and active state. Red only for warnings. */
:root{
  --paper:#e5e6ea; --ink:#2a2d33; --mute:#787c86; --rule:#d2d4d9; --well:#e5e6ea;
  --hi:#ffffff; --lo:#bfc2c9; --red:#cf3426; --onred:#fff;
  --angry-paper:#ecdcda; --angry-hi:#fff5f3; --angry-lo:#c9b0ac; --angry-rule:#dcc7c4;
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --s1:12px; --s2:14px; --s3:16px; --s4:21px; --s5:28px;
  --r-lg:26px; --r-md:18px; --r-sm:13px;
  --raise:7px 7px 16px var(--lo),-7px -7px 16px var(--hi);
  --raise-sm:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);
  --press:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);
  --press-sm:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#26282c; --ink:#e7e8eb; --mute:#8e929b; --rule:#33363b; --well:#26282c;
  --hi:#30333a; --lo:#1a1b1e; --red:#ff5a4a; --onred:#1a0604;
  --angry-paper:#33221f; --angry-hi:#3f2b27; --angry-lo:#211513; --angry-rule:#4a302b;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#26282c; --ink:#e7e8eb; --mute:#8e929b; --rule:#33363b; --well:#26282c;
  --hi:#30333a; --lo:#1a1b1e; --red:#ff5a4a; --onred:#1a0604;
  --angry-paper:#33221f; --angry-hi:#3f2b27; --angry-lo:#211513; --angry-rule:#4a302b;
  color-scheme:dark }
/* late night: warm dark, only when your own data says nights are your weak spot */
:root.night{--paper:#221a19;--ink:#efe5e2;--mute:#a1908b;--rule:#332826;--well:#221a19;--hi:#2d2321;--lo:#161010;--red:#ff5a4a;--onred:#1a0604;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--s2);line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
[hidden]{display:none!important}

.app{min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);transition:background .4s}
.app.angry{--paper:var(--angry-paper);--well:var(--angry-paper);--hi:var(--angry-hi);--lo:var(--angry-lo);--rule:var(--angry-rule)}
.view{max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}

/* type */
.lbl{font-size:var(--s1);font-weight:600;color:var(--mute);letter-spacing:.01em}
.h{font-size:var(--s4);font-weight:800;line-height:1.25;text-wrap:balance;margin:0;letter-spacing:-.01em}
.p{margin:0;color:var(--ink)}
.mute{color:var(--mute)}
.red{color:var(--red)}
.small{font-size:var(--s1)}
.dash{border:0;border-top:1px solid var(--rule);margin:0}

/* surfaces */
.card,.note,.receipt.paper,.chart,.sect,.rlist,.stmt{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--raise);padding:18px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:var(--s4);letter-spacing:-.02em}
.top .lbl{border-radius:999px;box-shadow:var(--raise-sm);padding:7px 14px;color:var(--ink);font-weight:700;white-space:nowrap}

/* hero dial */
.hero{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero-head .ttl{font-weight:800;font-size:var(--s3)}
.hero-head .sub{font-size:var(--s1);color:var(--mute)}
.pill{border-radius:999px;box-shadow:var(--press-sm);padding:6px 12px;font-size:var(--s1);font-weight:700;white-space:nowrap}
.dial{position:relative;width:100%;max-width:340px;margin:6px auto 0}
.dial svg{display:block;width:100%;height:auto}
.dial .tk{stroke:var(--rule);stroke-width:3;stroke-linecap:round}
.dial .tk.on{stroke:var(--ink)}
.mood-red .dial .tk.on,.mood-angry .dial .tk.on{stroke:var(--red)}
.dial .knob{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.mood-red .dial .knob{stroke:var(--red)}
.dial .inner{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round}
.gnum{position:absolute;left:0;right:0;bottom:-2%;display:flex;flex-direction:column;align-items:center}
.big{font-size:clamp(38px,12vw,50px);font-weight:800;line-height:1;letter-spacing:-.04em;white-space:nowrap}
.big .cur{font-weight:600;font-size:.5em;vertical-align:.55em;margin-right:.04em;letter-spacing:0}
.mood-red .big,.mood-angry .big{color:var(--red)}
.gnum .lbl{margin-top:4px}
.ends{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--mute);padding:0 3%;margin-top:-4px}
.verdict{font-size:var(--s3);font-weight:700;text-align:center;margin-top:8px}
.mood-red .verdict,.mood-angry .verdict{color:var(--red)}
.hero .meta{font-size:var(--s1);color:var(--mute);text-align:center}
.mood-angry .big{animation:shake .5s 1}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.mood-angry .big{animation:none}.app{transition:none}}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tile{border-radius:var(--r-lg);box-shadow:var(--raise);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:50%;box-shadow:var(--press-sm);display:grid;place-items:center;font-weight:800;font-size:var(--s2)}
.tile .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:var(--s4);font-weight:800;display:block;line-height:1.2}
.tile span{font-size:var(--s1);color:var(--mute)}
.tile b span{font-size:inherit;color:inherit}

/* buttons */
.btn{appearance:none;border:0;background:var(--paper);padding:14px 18px;font-weight:700;font-size:var(--s2);border-radius:var(--r-md);text-align:center;min-height:50px;box-shadow:var(--raise-sm);transition:box-shadow .15s,transform .1s}
.btn:active{box-shadow:var(--press-sm)}
.btn.solid{color:var(--ink);font-weight:800}
.btn.redb{color:var(--red);font-weight:800}
.btn.ghost{color:var(--mute)}
.btn.slim{padding:9px 14px;min-height:38px;font-size:var(--s1);border-radius:var(--r-sm)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big-cta{font-size:var(--s3);padding:20px;border-radius:var(--r-lg);box-shadow:var(--raise)}
.btn.big-cta:active{box-shadow:var(--press)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 0;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--mute);font-size:var(--s1);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* notes */
.note{display:flex;flex-direction:column;gap:10px}
.note.alarm .lbl{color:var(--red)}
.note.alarm{box-shadow:var(--raise),inset 0 0 0 1.5px color-mix(in srgb,var(--red) 45%,transparent)}

/* list rows (entries, evidence, debts) */
.receipt{display:flex;flex-direction:column;gap:12px}
.receipt>.lbl{padding:0 2px}
.ln{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:0;border-radius:var(--r-md);background:var(--paper);box-shadow:var(--raise-sm);text-align:left;width:100%;appearance:none;min-height:58px}
.ln .ic{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:var(--press-sm);display:grid;place-items:center;font-weight:800;font-size:var(--s1);color:var(--mute)}
.ln .what{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.ln .what b,.ln .what>span:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .what small{font-size:var(--s1);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .amt{white-space:nowrap;font-weight:800}
.tot{display:flex;justify-content:space-between;padding:4px 4px 0;font-weight:800}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;box-shadow:var(--press-sm);padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.want{color:var(--mute)} .tag.regret,.tag.em{color:var(--red)}
@keyframes feed{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.ln.printed{animation:feed .45s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.ln.printed{animation:none}}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;border:0;background:var(--paper);border-radius:var(--r-sm);box-shadow:var(--press);padding:13px 15px;font-size:var(--s3);outline:none;min-width:0}
.inp:focus{box-shadow:var(--press),0 0 0 2px color-mix(in srgb,var(--ink) 25%,transparent)}
.inp::placeholder{color:var(--mute);opacity:.8}
textarea.inp{min-height:84px;resize:vertical;font-size:var(--s2)}
.amount{font-size:clamp(38px,12vw,56px);font-weight:800;letter-spacing:-.03em;padding:10px 18px;border-radius:var(--r-md)}
input[type=time].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left;min-height:50px}
input[type=time].inp::-webkit-date-and-time-value{text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{appearance:none;border:0;background:var(--paper);padding:10px 14px;font-size:var(--s2);font-weight:700;border-radius:var(--r-md);text-align:left;display:flex;flex-direction:column;gap:1px;min-height:48px;box-shadow:var(--raise-sm)}
.chip small{font-size:11px;color:var(--mute);font-weight:600}
.chip.on{box-shadow:var(--press)}
.chip.locked small{color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px;padding:5px;border-radius:var(--r-md);box-shadow:var(--press)}
.seg button{appearance:none;border:0;background:transparent;padding:10px 4px;font-size:var(--s1);font-weight:700;border-radius:var(--r-sm);color:var(--mute);min-height:40px;text-transform:capitalize}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--raise-sm)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;background:none;width:100%;text-align:left;appearance:none;min-height:52px;font-weight:700}
.toggle .small{font-weight:500}
.toggle .sw{width:54px;height:30px;border-radius:999px;box-shadow:var(--press);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:var(--raise-sm);transition:left .18s}
.toggle.on .sw::after{left:28px;background:var(--ink);box-shadow:none}
.err{color:var(--red);font-size:var(--s2);font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--red);flex:none;margin-top:1px}
.stepper{display:flex;align-items:center;border-radius:999px;box-shadow:var(--press);padding:4px;width:max-content}
.stepper button{appearance:none;border:0;background:var(--paper);width:38px;height:38px;border-radius:50%;font-size:var(--s4);font-weight:700;box-shadow:var(--raise-sm)}
.stepper span{min-width:40px;text-align:center;font-weight:800}
.listrow{display:grid;grid-template-columns:1fr 110px 36px;gap:10px;align-items:end}
.listrow .x{appearance:none;border:0;background:var(--paper);height:36px;width:36px;border-radius:50%;font-size:var(--s4);color:var(--mute);box-shadow:var(--raise-sm);margin-bottom:6px}

/* tab bar: floating raised dock */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;border-radius:24px;background:var(--paper);box-shadow:var(--raise)}
.tabs button{appearance:none;border:0;background:transparent;padding:11px 4px;font-size:var(--s1);font-weight:700;color:var(--mute);border-radius:17px;min-height:46px}
.tabs button.on{color:var(--ink);box-shadow:var(--press-sm)}

/* takeover + sheet */
.over{position:fixed;inset:0;z-index:40;background:var(--paper);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
.over .view{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.over.redbg{--paper:var(--angry-paper);--well:var(--angry-paper);--hi:var(--angry-hi);--lo:var(--angry-lo);--rule:var(--angry-rule)}
.over.redbg .shout{color:var(--red)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(20,22,26,.35);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);color:var(--ink);border-radius:30px 30px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:88%;overflow-y:auto;
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;margin:0 auto 12px;box-shadow:var(--press-sm)}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet .sect,.sheet .rlist{box-shadow:none;padding:4px 0}
.shout{font-size:clamp(34px,10vw,48px);font-weight:800;line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:right;white-space:nowrap;font-weight:700}
.kv.strong{font-weight:800}

/* hold to confirm */
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--red)}
.hold .fill{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(var(--p,0));opacity:.18;border-radius:inherit}
.hold span{position:relative}

/* shame + goal */
.shame-total{font-size:clamp(48px,16vw,80px);font-weight:800;line-height:1;color:var(--red);letter-spacing:-.045em}
.bar{height:14px;border-radius:999px;box-shadow:var(--press);position:relative;overflow:hidden}
.bar i{position:absolute;inset:3px auto 3px 3px;border-radius:999px;background:var(--ink);max-width:calc(100% - 6px)}
.stamp{display:inline-block;color:var(--red);font-weight:800;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:999px;box-shadow:var(--press-sm);margin-left:8px;vertical-align:1px}
.ln .what .stamp{align-self:flex-start;margin:4px 0 0}
.stamp.big{font-size:var(--s1);padding:6px 12px;margin:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);
  padding:13px 18px;border-radius:16px;max-width:min(480px,calc(100% - 36px));font-weight:700;font-size:var(--s2);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.sect{display:flex;flex-direction:column;gap:14px}
.sect>.lbl{color:var(--ink);font-weight:800;font-size:var(--s3)}
.mono-pre{white-space:pre-wrap;word-break:break-all;font-size:10px;max-height:160px;overflow:auto;font-family:ui-monospace,Menlo,monospace}

/* monthly statement */
.stmt{display:flex;flex-direction:column;gap:0}
.stmt-stamp{align-self:center;margin:20px 0 6px;font-size:var(--s4);font-weight:800;letter-spacing:.08em;padding:12px 26px;border-radius:999px;box-shadow:var(--press)}
.stmt-stamp.good{color:var(--ink)} .stmt-stamp.bad{color:var(--red)}

/* rules list */
.rlist{display:flex;flex-direction:column;gap:12px}
.rlist>.lbl{color:var(--ink);font-weight:800;font-size:var(--s3);padding:0 2px}
.rrow{appearance:none;border:0;background:var(--paper);box-shadow:var(--raise-sm);border-radius:var(--r-md);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 16px;text-align:left;width:100%;min-height:56px;font-weight:700}
.rrow>span:first-child{flex:none}
.rrow .v{color:var(--mute);font-size:var(--s1);font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .v::after{content:"›";margin-left:10px;color:var(--ink);font-size:var(--s4);vertical-align:-2px}

/* spending graph */
.chart{display:flex;flex-direction:column;gap:12px}
.chart .row{flex-wrap:nowrap}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .area{fill:var(--ink);opacity:.06}
.chart .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .lim{fill:none;stroke:var(--mute);stroke-width:2;stroke-dasharray:4 4;stroke-linecap:round}
.chart .dot{fill:var(--ink);stroke:var(--paper);stroke-width:2}
.chart .dot.over{fill:var(--red)}
.chart .cross{stroke:var(--ink);stroke-width:1;opacity:.3}
.chart .base{stroke:var(--rule);stroke-width:1}
.chart .ax{fill:var(--mute);font-size:9px;font-family:var(--sans);font-weight:600}
.chart .ax.on{fill:var(--ink);font-weight:800}
.chart .hit{fill:transparent;cursor:pointer;outline:none}
.chart .hit:focus-visible{stroke:var(--red);stroke-width:2}
.readout{display:flex;flex-direction:column;gap:2px;min-height:44px;border-radius:var(--r-sm);box-shadow:var(--press-sm);padding:10px 14px}
.readout b{font-weight:800}
.key{display:flex;gap:14px;font-size:11px;color:var(--mute);font-weight:600}
.key i{display:inline-block;width:14px;height:0;border-top:2px solid var(--ink);vertical-align:3px;margin-right:6px}
.key i.d{border-top:2px dashed var(--mute)}
.key i.o{width:8px;height:8px;border:0;border-radius:50%;background:var(--red);vertical-align:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const now=()=>window.__NOW?new Date(window.__NOW):new Date();
const nowMs=()=>now().getTime();
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(now());
const parseD=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)};
const mkey=k=>k.slice(0,7);
const dim=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()};
const monthEnd=mk=>`${mk}-${pad(dim(mk))}`;
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const prevMonth=mk=>{const[y,m]=mk.split("-").map(Number);const d=new Date(y,m-2,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const num=v=>{const n=parseFloat(String(v??"").replace(/[,₹\s]/g,""));return isFinite(n)?n:NaN};
const rs=n=>{const v=Math.round(n||0);return (v<0?"−":"")+"₹"+Math.abs(v).toLocaleString("en-IN")};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pretty=k=>{const d=parseD(k);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const niceDate=k=>{const d=parseD(k);return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]}, ${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}`};
const short=k=>{const d=parseD(k);return `${d.getDate()} ${MON[d.getMonth()]}`};
const hm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const pick=(arr,seed)=>{let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))|0;return arr[Math.abs(h)%arr.length]};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
const TEN_MIN=10*60*1000, DAY_MS=864e5;

/* ============ storage ============ */
const KEY="udale.v1";
let storageOK=true;
function fresh(){return{v:1,setup:false,firstDay:null,
  settings:{foodDay:150,wishMin:500,remindAt:"21:00",server:"",pushOn:false},
  categories:[],fixed:[],savings:0,goal:null,goalsDone:[],months:{},entries:[],mods:[],debts:[],wish:[],
  locks:{},lockReviews:[],reviews:{},shame:[],notices:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const s=JSON.parse(r);return Object.assign(fresh(),s)}catch(e){storageOK=false;return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
let S=load()||fresh();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ============ engine ============ */
let memo={};
const invalidate=()=>{memo={}};
const cat=id=>S.categories.find(c=>c.id===id);
function graceBase(mk){const ks=Object.keys(S.months).filter(k=>k<mk).sort();return ks.length?S.months[ks[ks.length-1]].base0:null}
function kindOf(day){
  if(!S.firstDay||day<S.firstDay)return"none";
  const mk=mkey(day),m=S.months[mk];
  if(m)return day>=m.entered?"main":(graceBase(mk)!=null?"grace":"none");
  if(Number(day.slice(8))<=3&&graceBase(mk)!=null)return"grace";
  return"none";
}
function spentMap(){if(memo.sp)return memo.sp;const m={};for(const e of S.entries){if(e.emergency)continue;m[e.date]=(m[e.date]||0)+e.amount}return memo.sp=m}
const modAmt=x=>x.kind==="balance"?`${rs(x.from)} → ${rs(x.to)}`:`${x.amount>0?"+":""}${rs(x.amount)}`;
function mainBase(m,day,E){
  let b=m.base0;
  for(const x of S.mods){
    if(x.kind==="balance"||mkey(x.date)!==mkey(day)||x.date<m.entered)continue;
    let st=x.amount>0?x.date:(x.date<E?addDays(x.date,1):x.date);
    if(st<m.entered)st=m.entered;
    if(st<=day)b+=x.amount/(diffDays(st,E)+1);
  }
  return b;
}
function series(mk){
  if(memo["s"+mk])return memo["s"+mk];
  const out={},E=monthEnd(mk),t=today(),last=t<E?t:E,m=S.months[mk],gb=graceBase(mk),sp=spentMap();
  let carry=0,prev=null;
  for(let day=`${mk}-01`;day<=last;day=addDays(day,1)){
    const k=kindOf(day);
    if(k==="none"){prev=k;carry=0;continue}
    if(k!==prev)carry=0;
    const base=k==="grace"?gb:mainBase(m,day,E);
    const avail=base+carry,spent=sp[day]||0;
    carry=avail-spent;
    out[day]={kind:k,base,avail,spent,left:avail-spent,over:spent>avail+0.5,carryIn:avail-base};
    prev=k;
  }
  return memo["s"+mk]=out;
}
const dayInfo=d=>series(mkey(d))[d]||null;
function monthStatus(){
  const t=today(),mk=mkey(t);
  if(S.months[mk])return"ok";
  if(Number(t.slice(8))<=3&&graceBase(mk)!=null)return"grace";
  return"blocked";
}
function streak(){
  const t=today(),ti=dayInfo(t);if(ti&&ti.over)return 0;
  let n=0,d=addDays(t,-1);
  for(let i=0;i<500;i++){const x=dayInfo(d);if(!x||x.over)break;n++;d=addDays(d,-1)}
  return n;
}
function catSpent(id,mk){return sum(S.entries.filter(e=>e.catId===id&&!e.emergency&&mkey(e.date)===mk),e=>e.amount)}
function isLocked(id){const l=S.locks[id];return !!(l&&l.month===mkey(today()))}
function recheckLock(id){const c=cat(id);if(!c)return;const mk=mkey(today());if(isLocked(id)&&(!c.cap||catSpent(id,mk)<=c.cap))delete S.locks[id]}
function mkMonth(balance,savings,entered){
  const E=monthEnd(mkey(entered)),fixedTotal=sum(S.fixed,f=>f.amount),spendable=balance-fixedTotal-savings,days=diffDays(entered,E)+1;
  return{balance,savings,fixedTotal,fixed:S.fixed.map(f=>({...f})),spendable,entered,days,base0:spendable/days,closed:null};
}
function closeMonths(){
  const cur=mkey(today());
  for(const mk of Object.keys(S.months).sort()){
    const m=S.months[mk];if(mk>=cur||m.closed)continue;
    const s=series(mk),E=monthEnd(mk),left=s[E]?s[E].left:0,contrib=m.savings+left;
    if(S.goal){S.goal.saved=Math.max(0,(S.goal.saved||0)+contrib)}
    m.closed={left,contrib,ts:nowMs()};
    if(contrib<0)S.shame.push({id:uid(),ts:nowMs(),date:today(),type:"eaten",amount:-contrib,note:`Ate into savings in ${mk}`});
    S.notices.push({id:uid(),kind:"month",mk,left,contrib,savings:m.savings});
    invalidate();
  }
}
function weekStart(k){const d=parseD(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)}
function dueReview(){
  if(!S.setup)return null;
  const n=now(),t=dkey(n),ws=weekStart(t),sun=addDays(ws,6);
  const cand=(t===sun&&n.getHours()>=19)?ws:addDays(ws,-7);
  if(addDays(cand,6)<S.firstDay)return null;
  if(S.reviews[cand])return null;
  return cand;
}
function overdueDebts(){return S.debts.filter(d=>d.left>0.5&&diffDays(d.date,today())>14)}

function isNight(){const h=now().getHours();return h>=22||h<4}
function nightPattern(){
  const cut=addDays(today(),-30),w=S.entries.filter(e=>e.date>=cut&&!e.emergency&&e.tag!=="need");
  if(w.length<3)return null;
  const late=w.filter(e=>{const h=new Date(e.ts).getHours();return h>=22||h<4}),p=late.length/w.length;
  return p>=0.4?{p,amount:sum(late,e=>e.amount),n:late.length}:null;
}
function nightOn(){return S.setup&&isNight()&&!!nightPattern()}
/* ============ copy ============ */
const LINES={
  calm:["On track. Don't get cocky.","Holding up. For now.","You have money. Use your brain too."],
  warn:["Half gone. Slow down.","Stop. Do you actually need it?","Ease off."],
  red:["Enough.","This is all that's left. Think.","One more order and tomorrow is gone."],
  angry:["Go on, blow it. Starve tomorrow.","You're eating tomorrow's money.","Well done. Tomorrow's money is gone too."]
};
const NUDGE=["Nothing logged today. You really didn't spend a single rupee?","Today's log is empty. What are you hiding?"];

/* ============ ui state ============ */
let route=(location.hash||"#home").slice(1);
if(!["home","spend","shame","rules"].includes(route))route="home";
let modal=null;     // {type,...} full-screen takeover
let sheet=null;     // {type,...} bottom sheet
let toastMsg=null,toastT=null;
let pendingAfterLock=null;
const newDraft=()=>({mode:"spend",amount:"",catId:null,tag:null,method:"upi",split:false,people:2,names:"",emergency:false,reason:"",note:"",person:"",friendPaid:false,err:""});
const F={draft:newDraft(),setup:null,mform:{balance:"",savings:"",err:""},rev:{upi:"",checked:false,err:""},lockf:{what:"",next:"",ok:false,err:""},
  edit:{},adj:{sign:"+",amount:"",reason:"",err:""},balf:{balance:"",savings:"",err:"",open:false},settle:{amount:"",method:"upi",err:""},goalf:{name:"",target:"",err:""},
  catf:{name:"",cap:"",err:""},fixf:{name:"",amount:"",err:""},rulesf:{},imp:{text:"",err:""},reset:{typed:""}};

function toast(m){toastMsg=m;clearTimeout(toastT);toastT=setTimeout(()=>{toastMsg=null;renderToast()},4200);renderToast()}
function renderToast(){let t=$("#toast");if(!toastMsg){t&&t.remove();return}if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=toastMsg}

/* ============ render ============ */
function render(){
  invalidate();
  if(S.setup){closeMonths();save()}
  const app=$("#app");
  document.documentElement.classList.toggle("night",nightOn());
  const ti=S.setup?dayInfo(today()):null;
  let mood="mood-calm",angry=false;
  if(ti){const r=ti.avail>0?ti.left/ti.avail:-1;
    if(ti.left<-0.5){mood="mood-angry";angry=true}else if(r<0.2)mood="mood-red";else if(r<0.5)mood="mood-warn"}
  let html=`<div class="app ${mood} ${angry?"angry":""}">`;
  html+=`<main class="view" id="main">${S.setup?viewFor(route,ti,mood):""}</main>`;
  if(S.setup)html+=tabs();
  html+=`</div>`;
  const tk=takeover();
  if(tk)html+=tk;
  else if(sheet)html+=`<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in">${sheetHtml()}</div></div>`;
  const y=window.scrollY,ov=$(".over"),oy=ov?ov.scrollTop:0,sh=$(".sheet"),sy=sh?sh.scrollTop:0,keepOv=ov&&ov.dataset.k;
  app.innerHTML=html;
  const nov=$(".over");if(nov&&keepOv&&nov.dataset.k===keepOv)nov.scrollTop=oy;
  const nsh=$(".sheet");if(nsh&&sy)nsh.scrollTop=sy;
  window.scrollTo(0,y);
  if(route==="home")animateNumber();
}
function tabs(){
  const t=[["home","Today"],["spend","Spend"],["shame","Shame"],["rules","Rules"]];
  return `<nav class="tabs" aria-label="Screens"><div class="in">${t.map(([k,l])=>`<button class="${route===k?"on":""}" data-act="go" data-to="${k}" aria-current="${route===k?"page":"false"}">${l}</button>`).join("")}</div></nav>`;
}
function viewFor(r,ti,mood){
  if(r==="spend")return viewSpend();
  if(r==="shame")return viewShame();
  if(r==="rules")return viewRules();
  return viewHome(ti,mood);
}

/* ---------- HOME ---------- */
function viewHome(ti,mood){
  const t=today(),ms=monthStatus();
  let h=`<header class="top"><span class="brand">Uda le</span><span class="lbl">${niceDate(t)}</span></header>`;
  if(window.__PREVIEW)h+=`<div class="note"><span class="lbl">Preview</span><p class="p small">This is for trying it out. Install the real app from GitHub Pages (see the README) to get reminders and offline use.</p></div>`;
  if(!storageOK)h+=`<div class="note alarm"><span class="lbl">Not saving</span><p class="p">This browser isn't saving your data. Export a backup from Rules → Backup, and open the app from your Home Screen.</p></div>`;
  if(ms==="grace"){
    const mk=mkey(t);
    h+=`<div class="note"><span class="lbl">New month · deadline 3 ${MON[Number(mk.slice(5))-1]}</span>
      <p class="p">Enter your bank balance. Until then you're on last month's ${rs(graceBase(mk))} a day.</p>
      <button class="btn solid" data-act="openMonth">Enter balance</button></div>`;
  }
  if(ti){
    const pct=ti.avail>0?Math.max(0,Math.min(1,ti.left/ti.avail)):0;
    const key=mood.replace("mood-","");
    const carry=ti.carryIn;
    h+=`<section class="card hero" aria-live="polite">
      <div class="hero-head"><div><div class="ttl">Left today</div><div class="sub">${ti.kind==="grace"?"Grace days · last month's rate":`Limit ${rs(ti.avail)}`}</div></div><span class="pill">${ti.over?'<span class="red">Over</span>':`${Math.round(pct*100)}% left`}</span></div>
      ${dialHtml(ti,pct)}
      <div class="verdict">${esc(pick(LINES[key],t+key))}</div>
    </section>
    <button class="btn solid big-cta" data-act="go" data-to="spend">Log a spend</button>
    <div class="tiles">
      <div class="tile"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div><b><span data-testid="streak">${streak()}</span> days</b><span>Streak · ${ti.over?'<span class="red">limit broken</span>':"within limit"}</span></div></div>
      <div class="tile"><span class="ic">₹</span><div><b>${rs(ti.base)}</b><span>Daily${Math.abs(carry)>0.5?(carry>0?` · +${rs(carry)} carried`:` · ${rs(carry)} borrowed`):""}</span></div></div>
    </div>`;
  }
  // late night
  if(nightOn()){const np=nightPattern();h+=`<div class="note alarm"><span class="lbl">Late night · ${hm(nowMs())}</span><p class="p">${Math.round(np.p*100)}% of your wants and regrets in the last 30 days happened after 10pm. That's ${rs(np.amount)}. Put the phone down.</p></div>`}
  // action notes
  h+=homeNotes(ti);
  // today's receipt
  const te=S.entries.filter(e=>e.date===t).sort((a,b)=>b.ts-a.ts);
  h+=`<section class="receipt paper" aria-label="Today's entries"><span class="lbl">Today</span>`;
  if(!te.length)h+=`<p class="p mute small" style="padding:4px 2px">Nothing. Either you've reformed, or you're not logging.</p>`;
  for(const e of te)h+=entryLine(e);
  if(te.length)h+=`<div class="tot"><span>Total</span><span>${rs(sum(te.filter(e=>!e.emergency),e=>e.amount))}</span></div>`;
  h+=`<div class="row" style="justify-content:space-between;padding-top:6px"><button class="link" data-act="sheet" data-s="history">All entries</button>${hisaabLink()}</div></section>`;
  h+=chartHtml();
  // goal
  if(S.goal){const g=S.goal,p=Math.min(1,(g.saved||0)/g.target);
    h+=`<section class="card stack"><div class="row" style="justify-content:space-between"><span class="lbl">Goal · ${esc(g.name)}</span><span class="small">${rs(g.saved)} / ${rs(g.target)}</span></div><div class="bar" role="progressbar" aria-valuenow="${Math.round(p*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p*100}%"></i></div></section>`}
  return h;
}
function dialHtml(ti,pct){
  const N=44,cx=150,cy=150,R1=138,R2=124,on=Math.round(pct*N);let g="";
  for(let i=0;i<=N;i++){const a=Math.PI*(1-i/N),r2=i%11===0?R2-9:R2;
    g+=`<line class="tk ${pct>0&&i<=on?"on":""}" x1="${(cx+R1*Math.cos(a)).toFixed(1)}" y1="${(cy-R1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy-r2*Math.sin(a)).toFixed(1)}"/>`}
  g+=`<path class="inner" d="M${cx-112},${cy} A112,112 0 0 1 ${cx+112},${cy}"/>`;
  if(pct>0){const a=Math.PI*(1-on/N);g+=`<circle class="knob" cx="${(cx+(R1+2)*Math.cos(a)).toFixed(1)}" cy="${(cy-(R1+2)*Math.sin(a)).toFixed(1)}" r="7"/>`}
  const v=Math.abs(Math.round(ti.left));
  return `<div class="dial"><svg viewBox="0 -4 300 162" aria-hidden="true">${g}</svg>
    <div class="gnum"><div class="big" data-testid="left">${ti.left<-0.5?"−":""}<span class="cur">₹</span><span class="n" data-v="${v}">${v.toLocaleString("en-IN")}</span></div><span class="lbl">left of ${rs(ti.avail)}</span></div></div>
    <div class="dial ends" aria-hidden="true"><span>₹0</span><span>${rs(ti.avail)}</span></div>`;
}
function hisaabLink(){
  const inn=sum(S.debts.filter(d=>d.dir==="in"),d=>d.left),out=sum(S.debts.filter(d=>d.dir==="out"),d=>d.left);
  if(inn<0.5&&out<0.5)return"";
  return `<button class="link" data-act="sheet" data-s="hisaab">Owed to you ${rs(inn)} · You owe ${rs(out)}</button>`;
}
let justLogged=null;
function entryLine(e,showDate){
  const tag=e.emergency?`<span class="tag em">emergency</span>`:(e.tag!=="need"?`<span class="tag ${e.tag}">${e.tag}</span>`:"");
  const extra=e.split?` · split ÷${e.split.people}`:(e.method==="friend"?" · friend paid":(e.method==="cash"?" · cash":""));

function homeNotes(ti){
  let h="";const t=today();
  if(S.goal&&S.goal.saved>=S.goal.target)h+=`<div class="note"><span class="lbl">Goal reached</span><p class="p">${rs(S.goal.target)} saved for ${esc(S.goal.name)}. Pick a new goal.</p><button class="btn slim solid" data-act="go" data-to="rules">New goal</button></div>`;

  const od=overdueDebts();
  if(od.length)h+=`<div class="note alarm"><span class="lbl">Money stuck</span>${od.map(d=>`<button class="kv" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left" data-act="sheet" data-s="settle" data-id="${d.id}"><span>${d.dir==="in"?`${esc(d.person)}: ${rs(d.left)}, ${diffDays(d.date,t)} days. <b>Ask for it.</b>`:`You owe ${esc(d.person)} ${rs(d.left)}, ${diffDays(d.date,t)} days. <b>Pay it back.</b>`}</span></button>`).join("")}</div>`;
  // evening nudge
  const [rh,rm]=(S.settings.remindAt||"21:00").split(":").map(Number);const n=now();
  if(ti&&!S.entries.some(e=>e.date===t)&&(n.getHours()*60+n.getMinutes())>=rh*60+rm)h+=`<div class="note"><span class="lbl">Log check</span><p class="p">${pick(NUDGE,t)}</p></div>`;
  return h;
}

/* ---------- GRAPH ---------- */
let chartRange="week",chartSel=null,chartSelFor=null;
function chartData(){
  const t=today(),days=[];
  if(chartRange==="week"){for(let i=6;i>=0;i--)days.push(addDays(t,-i))}
  else{for(let d=`${mkey(t)}-01`;d<=t;d=addDays(d,1))days.push(d)}
  const sp=spentMap();
  return days.map(d=>{const x=dayInfo(d);return{d,x,spent:sp[d]||0,lim:x?Math.max(0,x.avail):null,over:!!(x&&x.over)}});
}
function chartHtml(){
  const data=chartData(),n=data.length,W=320,H=128,top=12,base=H-18,padX=8;
  if(chartSelFor!==today()){chartSel=null;chartSelFor=today()}
  if(!chartSel||!data.some(r=>r.d===chartSel))chartSel=today();
  const max=Math.max(1,...data.map(r=>Math.max(r.spent,r.lim||0)))*1.1;
  const slot=(W-padX*2)/Math.max(1,n-1),X=i=>n===1?W/2:padX+i*slot,Y=v=>base-(base-top)*(v/max);
  const pts=data.map((r,i)=>({...r,i,px:X(i),py:Y(r.spent)})).filter(r=>r.x);
  const seg=(arr,key)=>arr.map((r,k)=>`${k?"L":"M"}${r.px.toFixed(1)},${(key==="lim"?Y(r.lim):r.py).toFixed(1)}`).join("");
  let g=`<line class="base" x1="0" x2="${W}" y1="${base+0.5}" y2="${base+0.5}"/>`;
  const sel=data.find(r=>r.d===chartSel),si=data.indexOf(sel);
  g+=`<line class="cross" x1="${X(si)}" x2="${X(si)}" y1="${top-6}" y2="${base}"/>`;
  if(pts.length){
    g+=`<path class="area" d="${seg(pts)}L${pts[pts.length-1].px},${base}L${pts[0].px},${base}Z"/>`;
    g+=`<path class="lim" d="${seg(pts,"lim")}"/>`;
    g+=`<path class="line" d="${seg(pts)}"/>`;
    for(const r of pts){const on=r.d===chartSel;
      if(r.over||on||n<=7)g+=`<circle class="dot ${r.over?"over":""}" cx="${r.px}" cy="${r.py}" r="${on?6:r.over?5:4}"/>`}
  }
  const half=n===1?W/2:slot/2;
  data.forEach((r,i)=>{const dd=parseD(r.d),on=r.d===chartSel;
    const lab=chartRange==="week"?DOW[dd.getDay()].slice(0,2):(dd.getDate()===1||dd.getDate()%5===0||on?String(dd.getDate()):"");
    if(lab)g+=`<text class="ax ${on?"on":""}" x="${X(i)}" y="${H-4}" text-anchor="middle">${lab}</text>`;
    g+=`<rect class="hit" tabindex="0" role="button" aria-label="${niceDate(r.d)}: spent ${rs(r.spent)}${r.lim!=null?`, limit ${rs(r.lim)}`:""}" data-act="chartSel" data-d="${r.d}" x="${Math.max(0,X(i)-half)}" y="0" width="${half*2}" height="${H}"/>`;
  });
  const tot=sum(data,r=>r.spent),act=data.filter(r=>r.x).length||1;
  const es=S.entries.filter(e=>e.date===sel.d&&!e.emergency),ct={};for(const e of es)ct[e.catName]=(ct[e.catName]||0)+e.amount;
  const topc=Object.entries(ct).sort((a,b)=>b[1]-a[1])[0];
  const diff=sel.lim!=null?sel.lim-sel.spent:null;
  return `<section class="chart" aria-label="Spending graph">
    <div class="row" style="justify-content:space-between"><span class="lbl">Spending</span>
      <div class="seg" style="--n:2;width:150px"><button class="${chartRange==="week"?"on":""}" data-act="chartRange" data-v="week">7 days</button><button class="${chartRange==="month"?"on":""}" data-act="chartRange" data-v="month">Month</button></div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending, ${chartRange==="week"?"last 7 days":"this month"}">${g}</svg>
    <div class="key"><span><i></i>spent</span><span><i class="d"></i>daily limit</span><span><i class="o"></i>over</span></div>
    <div class="readout" aria-live="polite"><span class="small mute">${niceDate(sel.d)}</span>
      <span>Spent <b>${rs(sel.spent)}</b>${sel.lim!=null?` of ${rs(sel.lim)} · ${diff<-0.5?`<b class="red">${rs(-diff)} over</b>`:`${rs(diff)} under`}`:""}</span>
      <span class="small mute">${es.length?`${es.length} entr${es.length>1?"ies":"y"}${topc?` · most on ${esc(topc[0])}`:""} · `:""}${chartRange==="week"?"7 days":"Month"}: ${rs(tot)} · avg ${rs(tot/act)}/day</span></div>
    <table class="sr"><caption>Daily spending</caption><tr><th>Day</th><th>Spent</th><th>Limit</th></tr>${data.map(r=>`<tr><td>${niceDate(r.d)}</td><td>${rs(r.spent)}</td><td>${r.lim!=null?rs(r.lim):"–"}</td></tr>`).join("")}</table>
  </section>`;
}
let lastLeft=null;
function animateNumber(){
  const el=document.querySelector(".big .n");if(!el){return}
  const to=Number(el.dataset.v),from=lastLeft;lastLeft=to;
  if(from==null||from===to||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;
  const t0=performance.now(),D=450;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e).toLocaleString("en-IN");if(k<1&&el.isConnected)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* ---------- SHAME ---------- */
function viewShame(){
  const mk=mkey(today());
  const regrets=S.entries.filter(e=>e.tag==="regret");
  const untracked=S.shame.filter(s=>s.type==="untracked");
  const other=S.shame.filter(s=>s.type!=="untracked");
  const mRegret=sum(regrets.filter(e=>mkey(e.date)===mk),e=>e.amount);
  const mUntr=sum(untracked.filter(s=>mkey(s.date)===mk),s=>s.amount);
  const mTot=mRegret+mUntr;
  const all=sum(regrets,e=>e.amount)+sum(untracked,s=>s.amount);
  const ratio=S.goal&&S.goal.target?mTot/S.goal.target:0;
  let h=`<header class="top"><span class="brand">Wall of shame</span><span class="lbl">${MON[Number(mk.slice(5))-1]}</span></header>`;
  h+=`<section class="stack"><span class="lbl">Wasted this month</span><div class="row" style="align-items:flex-end;gap:14px"><div class="shame-total">${rs(mTot)}</div>${mTot>=1?`<span class="stamp big">WASTED</span>`:""}</div>
    <p class="p">${mTot<1?"Nothing yet. Let's see how long that lasts.":S.goal?`That's <b>×${ratio.toFixed(ratio<0.1?2:1)}</b> of your ${esc(S.goal.name)}.`:""}</p>
    <div class="kv small"><span>Regret</span><span>${rs(mRegret)}</span></div>
    <div class="kv small"><span>Untracked (in UPI, not logged here)</span><span>${rs(mUntr)}</span></div>
    <div class="kv small strong"><span>All time</span><span>${rs(all)}</span></div></section>`;
  const items=[...regrets.map(e=>({ts:e.ts,date:e.date,amount:e.amount,what:`${e.catName}${e.note?" · "+e.note:""}`,k:"regret"})),
    ...untracked.map(s=>({ts:s.ts,date:s.date,amount:s.amount,what:s.note,k:"untracked"})),
    ...other.map(s=>({ts:s.ts,date:s.date,amount:s.amount,what:s.note,k:s.type}))].sort((a,b)=>b.ts-a.ts);
  h+=`<section class="receipt"><span class="lbl" style="padding-bottom:6px">Evidence</span>`;
  if(!items.length)h+=`<p class="p small mute" style="padding:8px 0">Empty. Tag something as regret and it lands here. Forever.</p>`;
  for(const i of items)h+=`<div class="ln"><span class="what">${short(i.date)} ${esc(i.what)}<span class="stamp ${i.k==="regret"?"":"tilt"}">${{regret:"REGRET",untracked:"VOID",skipped:"SKIPPED",eaten:"EATEN"}[i.k]||i.k.toUpperCase()}</span></span><span class="amt">${rs(i.amount)}</span></div>`;
  h+=`</section>`;
  const dropped=S.wish.filter(w=>w.status==="dropped");
  if(dropped.length)h+=`<p class="p small mute">Waiting list saved you ${rs(sum(dropped,w=>num(w.payload.amount)))} (${dropped.length} items). That's not shame. Remember it.</p>`;
  return h;
}

/* ---------- TAKEOVERS ---------- */
function takeover(){
  if(!S.setup)return over("setup",viewSetup());
  const stn=S.notices.find(n=>n.kind==="month");
  if(stn)return over("stmt"+stn.mk,viewStatement(stn));
  if(monthStatus()==="blocked")return over("month",viewMonth(true),true);
  if(modal&&modal.type==="month")return over("month",viewMonth(false));
  const rv=dueReview();
  if(rv)return over("review"+rv,viewReview(rv));
  if(modal&&modal.type==="lock")return over("lock",viewLock(),true);
  if(modal&&modal.type==="pause")return over("pause",viewPause(),modal.pain);
  return null;
}

/* weekly review */
function reviewData(ws){
  const we=addDays(ws,6),inW=d=>d>=ws&&d<=we;
  const es=S.entries.filter(e=>inW(e.date));
  const norm=es.filter(e=>!e.emergency);
  const by=t=>sum(norm.filter(e=>e.tag===t),e=>e.amount);
  const wr=norm.filter(e=>e.tag!=="need");
  const late=wr.filter(e=>{const h=new Date(e.ts).getHours();return h>=22||h<4});
  const catTot={};for(const e of wr)catTot[e.catName]=(catTot[e.catName]||0)+e.amount;
  const topCat=Object.entries(catTot).sort((a,b)=>b[1]-a[1])[0];
  const dowTot={};for(const e of wr){const k=DOW[parseD(e.date).getDay()];dowTot[k]=(dowTot[k]||0)+e.amount}
  const topDow=Object.entries(dowTot).sort((a,b)=>b[1]-a[1])[0];
  let days=0,over=0;for(let d=ws;d<=we;d=addDays(d,1)){const x=dayInfo(d);if(x){days++;if(x.over)over++}}
  const upiLogged=sum(es.filter(e=>e.method==="upi"),e=>e.paid??e.amount)
    +sum(S.debts.filter(d=>d.dir==="in"&&d.source==="lend"&&d.method==="upi"&&inW(d.date)),d=>d.amount)
    +sum(S.debts.filter(d=>d.dir==="out").flatMap(d=>d.settled||[]).filter(x=>x.method==="upi"&&inW(x.date)),x=>x.amount);
  return{ws,we,es,norm,need:by("need"),want:by("want"),regret:by("regret"),total:sum(norm,e=>e.amount),wr,late,topCat,topDow,days,over,
    em:es.filter(e=>e.emergency),adj:S.mods.filter(x=>(x.kind==="adjust"||x.kind==="balance")&&inW(x.date)),locks:S.lockReviews.filter(l=>inW(dkey(new Date(l.ts)))),upiLogged,
    dropped:S.wish.filter(w=>w.status==="dropped"&&w.decided&&inW(dkey(new Date(w.decided))))};
}
function viewReview(ws){
  const r=reviewData(ws),f=F.rev;
  let h=`<header class="top"><span class="brand">Weekly review</span><span class="lbl">${short(r.ws)} – ${short(r.we)}</span></header>`;
  h+=`<h1 class="shout">Your week. No running.</h1>`;
  h+=`<section class="stack"><div class="kv"><span>Total spent</span><span>${rs(r.total)}</span></div>
    <div class="kv"><span>Need</span><span>${rs(r.need)}</span></div>
    <div class="kv"><span>Want</span><span>${rs(r.want)}</span></div>
    <div class="kv"><span class="red">Regret</span><span class="red">${rs(r.regret)}</span></div>
    <div class="kv strong"><span>Want + regret</span><span>${rs(r.want+r.regret)}${S.goal?` · ${Math.round((r.want+r.regret)/S.goal.target*100)}% of your goal`:""}</span></div>
    <div class="kv"><span>Limit broken</span><span>${r.over} / ${r.days} days</span></div></section>`;
  // patterns
  const pat=[];
  if(r.wr.length>=2&&r.late.length)pat.push(`${Math.round(r.late.length/r.wr.length*100)}% of wants/regrets happened after 10pm.`);
  if(r.topCat)pat.push(`Most wasted on: ${esc(r.topCat[0])} (${rs(r.topCat[1])}).`);
  if(r.topDow&&r.wr.length>=3)pat.push(`Worst day: ${r.topDow[0]} (${rs(r.topDow[1])}).`);
  if(r.dropped.length)pat.push(`The waiting list saved you ${rs(sum(r.dropped,w=>num(w.payload.amount)))}.`);
  h+=`<section class="sect"><span class="lbl">Patterns</span>${pat.length?pat.map(p=>`<p class="p">${p}</p>`).join(""):`<p class="p mute">Not enough data for patterns. Either you were good, or you didn't log.</p>`}</section>`;
  // wants → regret
  const wants=r.norm.filter(e=>e.tag==="want");
  if(wants.length)h+=`<section class="sect"><span class="lbl">Which of these wants were regrets?</span><p class="p small mute">Tap to mark as regret. Once a regret, always a regret.</p><div class="receipt">${wants.map(e=>`<button class="ln" data-act="markRegret" data-id="${e.id}"><span class="what">${short(e.date)} ${esc(e.catName)}${e.note?" · "+esc(e.note):""}</span><span class="amt">${rs(e.amount)} →</span></button>`).join("")}</div></section>`;
  if(r.em.length)h+=`<section class="sect"><span class="lbl">Emergencies (${r.em.length})</span>${r.em.map(e=>`<div class="kv"><span>${short(e.date)} · ${esc(e.reason)}</span><span>${rs(e.amount)}</span></div>`).join("")}${r.em.length>=3?`<p class="p red">${r.em.length} emergencies in one week? Really?</p>`:""}</section>`;
  if(r.adj.length)h+=`<section class="sect"><span class="lbl">Budget changes</span>${r.adj.map(x=>`<div class="kv"><span>${short(x.date)} · ${esc(x.note)}</span><span>${modAmt(x)}</span></div>`).join("")}</section>`;
  if(r.locks.length)h+=`<section class="sect"><span class="lbl">Lock reviews</span>${r.locks.map(l=>`<p class="p small">${esc(l.catName)}: "${esc(l.what)}"</p>`).join("")}</section>`;
  // honesty
  h+=`<section class="sect"><span class="lbl">Honesty check</span><p class="p">Open your UPI apps (GPay/PhonePe/Paytm) and enter the total paid from ${short(r.ws)} to ${short(r.we)}. Add up all apps.</p>
   <div class="field"><label class="lbl" for="rupi">Paid by UPI (this week)</label><input id="rupi" class="inp amount" inputmode="decimal" value="${esc(f.upi)}" data-bind="rev.upi" placeholder="₹0"></div>
   ${f.err?`<p class="err">${esc(f.err)}</p>`:""}`;
  if(f.checked){const u=num(f.upi),gap=u-r.upiLogged;
    h+=`<div class="kv"><span>UPI app</span><span>${rs(u)}</span></div><div class="kv"><span>Logged here (UPI)</span><span>${rs(r.upiLogged)}</span></div>
     <div class="kv strong"><span>${gap>0.5?"Hidden":"Difference"}</span><span class="${gap>0.5?"red":""}">${rs(Math.max(0,gap))}</span></div>
     <p class="p ${gap>0.5?"red":""}">${gap>0.5?`${rs(gap)} with no record. It goes on the Wall of Shame as "untracked".`:"Everything matches. An honest week."}</p>`;
    h+=`<button class="btn solid big-cta" data-act="reviewAck" data-ws="${ws}">Yes, I did all of this</button>`;
  }else h+=`<button class="btn solid" data-act="reviewCheck">Check</button>`;
  h+=`</section>`;
  return h;
}

  if(s.type==="history"){

    const row=d=>`<button class="ln" data-act="sheet" data-s="settle" data-id="${d.id}"><span class="what">${esc(d.person)} · ${diffDays(d.date,today())} days${d.note?" · "+esc(d.note):""}</span><span class="amt">${rs(d.left)}</span></button>`;

     <div class="receipt"><span class="lbl">Owed to you · ${rs(sum(inn,d=>d.left))}</span>${inn.map(row).join("")||`<p class="p small mute">None.</p>`}</div>

    return `<div class="row" style="justify-content:space-between"><span class="lbl">${d.dir==="in"?"Got paid back":"Paid back"}</span><button class="link" data-act="closeSheet">Close</button></div>
     <h2 class="h">${d.dir==="in"?`${esc(d.person)} owes you ${rs(d.left)}`:`You owe ${esc(d.person)} ${rs(d.left)}`}</h2>
     <p class="p small mute">since ${short(d.date)} · ${diffDays(d.date,today())} days${d.note?" · "+esc(d.note):""}</p>
     <div class="field"><label class="lbl" for="sa">How much</label><input id="sa" class="inp amount" inputmode="decimal" value="${esc(f.amount)}" data-bind="settle.amount"></div>
     ${d.dir==="out"?`<div class="seg" style="--n:2">${["upi","cash"].map(k=>`<button class="${f.method===k?"on":""}" data-act="settleMethod" data-v="${k}">${k.toUpperCase()}</button>`).join("")}</div>`:`<p class="p small mute">Money you get back is added to the limit for the remaining days.</p>`}
     ${f.err?`<p class="err">${esc(f.err)}</p>`:""}
     <button class="btn solid" data-act="doSettle">${d.dir==="in"?"Got it":"Paid it"}</button>`;
  }
  if(s.type==="reset")return `<span class="lbl">Delete everything</span><p class="p">Sure? Type: <b>DELETE</b></p><input class="inp" id="rst" autocomplete="off" value="${esc(F.reset.typed)}" data-bind="reset.typed"><div class="row"><button class="btn ghost grow" data-act="closeSheet">No</button><button class="btn redb grow" data-act="doReset">Delete</button></div>`;
  if(s.type==="import")return `<span class="lbl">Import</span><p class="p">This replaces all your current data (${s.count} entries in the file).</p><div class="row"><button class="btn ghost grow" data-act="closeSheet">No</button><button class="btn solid grow" data-act="doImport">Replace</button></div>`;
  return"";
}

/* ============ actions ============ */
function go(r){route=r;try{history.replaceState(null,"","#"+r)}catch(e){location.hash=r}F.draft.err="";render();window.scrollTo(0,0)}
function setPath(path,val){const ks=path.split(".");let o=F;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}

function validateSpend(d){
  const a=num(d.amount);
  if(!(a>0))return"Enter an amount.";
  if(a>10000000)return"That much? Really? Check the amount.";
  if(d.mode==="spend"||(d.mode==="borrow"&&d.friendPaid)){
    if(!d.catId||!cat(d.catId))return"Pick a category.";
    if(!d.tag)return"Pick need, want or regret.";
  }
  if(d.mode==="spend"&&d.split){
    if(d.people<2)return"A split needs at least 2 people.";
    const names=d.names.split(",").map(x=>x.trim()).filter(Boolean);
    if(names.length!==d.people-1)return`Need ${d.people-1} names (besides you), comma separated. You have ${names.length}.`;
  }
  if(d.mode==="spend"&&d.emergency&&d.reason.trim().length<5)return"Write the reason for the emergency. The real one.";
  if((d.mode==="lend"||d.mode==="borrow")&&!d.person.trim())return"Enter a name.";
  return"";
}
function submitSpend(){
  const d=F.draft;d.err=validateSpend(d);
  if(d.err){render();return}
  if(monthStatus()==="blocked"){render();return}
  const p=JSON.parse(JSON.stringify(d));
  if(p.mode==="lend"){doLend(p);return}
  if(p.mode==="borrow"&&!p.friendPaid){doBorrow(p);return}
  const run=()=>{
    if(p.mode==="borrow"){commitSpend({...p,method:"friend",split:false,emergency:false});return}
    const own=p.split?Math.round(num(p.amount)/p.people):num(p.amount);
    if(!p.emergency&&p.tag!=="need"&&own>=S.settings.wishMin){
      S.wish.push({id:uid(),ts:nowMs(),payload:p,status:"wait"});save();
      F.draft=newDraft();toast(`${rs(own)} want. Wait 24 hours. I'll ask tomorrow.`);go("home");return}
    if(!p.emergency&&p.tag!=="need"){modal={type:"pause",payload:p,pain:dayInfo(today())&&dayInfo(today()).left-own<-0.5};render();window.scrollTo(0,0);return}
    commitSpend(p);
  };
  if(!p.emergency&&isLocked(p.catId)){openLock(p.catId,run);return}
  run();
}
function openLock(catId,after){F.lockf={what:"",next:"",ok:false,err:""};pendingAfterLock=after;modal={type:"lock",catId};render()}
function commitSpend(p,opt={}){
  const before=dayInfo(today());const wasOver=before?before.over:false;
  const a=num(p.amount),date=today(),ts=nowMs(),id=uid();
  const c=cat(p.catId);
  let own=a;
  const e={id,ts,date,amount:own,paid:p.method==="friend"?0:a,catId:p.catId,catName:c?c.name:"?",tag:p.tag,method:p.method,emergency:!!p.emergency,reason:p.emergency?p.reason.trim():"",note:p.note.trim(),split:null};
  if(p.split){
    const n=p.people;own=Math.round(a/n);e.amount=own;e.split={total:a,people:n};
    const names=p.names.split(",").map(x=>x.trim()).filter(Boolean);
    const others=a-own;names.forEach((nm,i)=>{
      const share=i<names.length-1?Math.round(others/names.length):others-Math.round(others/names.length)*(names.length-1);
      const dbt={id:uid(),dir:"in",person:nm,amount:share,left:share,ts,date,entryId:id,source:"split",method:p.method,note:`${c?c.name:""}${p.note?" · "+p.note.trim():""} split`,settled:[]};
      S.debts.push(dbt);S.mods.push({id:uid(),ts,date,amount:-share,kind:"lend",ref:dbt.id,note:`Split: ${nm}`});
    });
  }
  if(p.mode==="borrow"){S.debts.push({id:uid(),dir:"out",person:p.person.trim(),amount:a,left:a,ts,date,entryId:id,source:"friendpaid",method:"friend",note:`${c?c.name:""}${p.note?" · "+p.note.trim():""}`,settled:[]})}
  if(e.emergency)S.mods.push({id:uid(),ts,date,amount:-e.amount,kind:"emergency",ref:id,note:e.reason});
  S.entries.push(e);justLogged=e.id;setTimeout(()=>{if(justLogged===e.id)justLogged=null},1200);
  if(opt.wishId){const w=S.wish.find(x=>x.id===opt.wishId);if(w){w.status="bought";w.decided=ts}}
  invalidate();
  const msgs=[];
  if(!e.emergency&&c&&c.cap&&catSpent(c.id,mkey(date))>c.cap){S.locks[c.id]={month:mkey(date),ts};msgs.push(`${c.name} cap broken. Locked.`)}
  const after=dayInfo(today());
  if(e.emergency){}
  else if(after&&after.over&&!wasOver)msgs.push(`Limit crossed. Streak 0. ${rs(-after.left)} taken from tomorrow.`);
  else if(after&&after.over)msgs.push(`${rs(-after.left)} from tomorrow now. Keep going.`);
  save();F.draft=newDraft();modal=null;
  toast(msgs.length?msgs.join(" "):e.emergency?"Emergency logged. It'll show in your review.":e.tag==="regret"?"Regret. Sent to the Wall of Shame.":`${rs(e.amount)} logged.`);
  go("home");
}
function doLend(p){
  const a=num(p.amount),ts=nowMs(),date=today();
  const d={id:uid(),dir:"in",person:p.person.trim(),amount:a,left:a,ts,date,source:"lend",method:p.method,note:p.note.trim(),settled:[]};
  S.debts.push(d);S.mods.push({id:uid(),ts,date,amount:-a,kind:"lend",ref:d.id,note:`Lent: ${d.person}`});
  save();F.draft=newDraft();toast(`${rs(a)} to ${d.person}. Taken from your remaining days. Get it back.`);go("home");
}
function doBorrow(p){
  const a=num(p.amount),ts=nowMs();
  S.debts.push({id:uid(),dir:"out",person:p.person.trim(),amount:a,left:a,ts,date:today(),source:"cash",method:"cash",note:p.note.trim(),settled:[]});
  save();F.draft=newDraft();toast(`${rs(a)} borrowed from ${p.person.trim()}. This isn't your money.`);go("home");
}

const A={
  go:el=>go(el.dataset.to),
  mode:el=>{F.draft.mode=el.dataset.v;F.draft.err="";render()},
  cat:el=>{F.draft.catId=el.dataset.v;render()},
  tag:el=>{F.draft.tag=el.dataset.v;render()},
  method:el=>{F.draft.method=el.dataset.v;render()},
  flip:el=>{const k=el.dataset.k;F.draft[k]=!F.draft[k];render()},
  people:el=>{F.draft.people=Math.max(2,Math.min(30,F.draft.people+Number(el.dataset.v)));render()},
  submitSpend,
  pauseNo:()=>{modal=null;F.draft=newDraft();toast("Good call. Money saved.");go("home")},
  pauseYes:()=>{const p=modal.payload,w=modal.wishId;commitSpend(p,{wishId:w})},
  lockCancel:()=>{modal=null;pendingAfterLock=null;render()},
  lockDone:()=>{const f=F.lockf;
    if(f.what.trim().length<10){f.err="Say what went wrong in a bit more detail (10+ letters).";render();return}
    if(f.next.trim().length<10){f.err="Write your plan for next time (10+ letters).";render();return}
    if(!f.ok){f.err="Admit it first. Tick the box.";render();return}
    const c=cat(modal.catId);delete S.locks[c.id];S.lockReviews.push({id:uid(),ts:nowMs(),catId:c.id,catName:c.name,what:f.what.trim(),next:f.next.trim(),spent:catSpent(c.id,mkey(today()))});
    save();modal=null;const run=pendingAfterLock;pendingAfterLock=null;toast(`${c.name} unlocked for one spend. Go over the cap again and it locks again.`);if(run)run();else render()},
  wishNo:el=>{const w=S.wish.find(x=>x.id===el.dataset.id);w.status="dropped";w.decided=nowMs();save();toast(`${rs(num(w.payload.amount))} saved. See? You didn't need it.`);render()},
  wishYes:el=>{const w=S.wish.find(x=>x.id===el.dataset.id);const p=w.payload;
    const run=()=>{const own=p.split?Math.round(num(p.amount)/p.people):num(p.amount);modal={type:"pause",payload:p,wishId:w.id,pain:dayInfo(today())&&dayInfo(today()).left-own<-0.5};render();window.scrollTo(0,0)};
    if(!cat(p.catId)){w.status="dropped";w.decided=nowMs();save();toast("That category is gone. Item removed.");render();return}
    if(isLocked(p.catId)){openLock(p.catId,run);return}run()},
  closeStatement:el=>{S.notices=S.notices.filter(n=>n.id!==el.dataset.id);save();window.scrollTo(0,0);render()},
  dismissNotice:el=>{S.notices=S.notices.filter(n=>n.id!==el.dataset.id);save();render()},
  sheet:el=>{const s=el.dataset.s;sheet={type:s,id:el.dataset.id};
    if(s==="entry"){const e=S.entries.find(x=>x.id===el.dataset.id);if(e)F.edit={amount:String(e.amount),catId:e.catId,tag:e.tag,method:e.method,note:e.note,err:""}}
    if(s==="settle"){const d=S.debts.find(x=>x.id===el.dataset.id);F.settle={amount:d?String(Math.round(d.left)):"",method:"upi",err:""}}
    if(s==="reset")F.reset.typed="";
    render()},
  closeSheet:()=>{sheet=null;render()},
  chartSel:el=>{chartSel=el.dataset.d;render()},
  chartRange:el=>{chartRange=el.dataset.v;chartSel=null;render()},
  rule:el=>{sheet={type:"rule",k:el.dataset.k};render()},
  editCat:el=>{F.edit.catId=el.dataset.v;render()},
  editTag:el=>{F.edit.tag=el.dataset.v;render()},
  editMethod:el=>{F.edit.method=el.dataset.v;render()},
  saveEdit:()=>{const e=S.entries.find(x=>x.id===sheet.id),f=F.edit;
    if(!e||nowMs()-e.ts>=TEN_MIN){f.err="10 minutes are up.";render();return}
    const a=num(f.amount);if(!(a>0)){f.err="Enter a valid amount.";render();return}
    const oldCat=e.catId;e.amount=a;e.paid=a;e.catId=f.catId;e.catName=cat(f.catId)?.name||e.catName;e.tag=f.tag;e.method=f.method;e.note=(f.note||"").trim();
    invalidate();recheckLock(oldCat);const c=cat(e.catId);if(c&&c.cap&&catSpent(c.id,mkey(today()))>c.cap&&!isLocked(c.id))S.locks[c.id]={month:mkey(today()),ts:nowMs()};else recheckLock(e.catId);
    save();sheet=null;toast("Fixed.");render()},
  delEntry:()=>{const e=S.entries.find(x=>x.id===sheet.id);if(!e)return;
    if(nowMs()-e.ts>=TEN_MIN){toast("10 minutes are up. Can't delete.");return}
    const dIds=S.debts.filter(d=>d.entryId===e.id).map(d=>d.id);
    S.debts=S.debts.filter(d=>d.entryId!==e.id);S.mods=S.mods.filter(m=>m.ref!==e.id&&!dIds.includes(m.ref));S.entries=S.entries.filter(x=>x.id!==e.id);
    invalidate();recheckLock(e.catId);save();sheet=null;toast("Deleted.");render()},
  markRegret:el=>{const e=S.entries.find(x=>x.id===el.dataset.id);if(e&&!e.emergency){e.tag="regret";save();if(sheet)sheet=null;toast("Regret. On the Wall of Shame.");render()}},
  settleMethod:el=>{F.settle.method=el.dataset.v;render()},
  doSettle:()=>{const d=S.debts.find(x=>x.id===sheet.id),f=F.settle,a=num(f.amount);
    if(!(a>0)||a>d.left+0.5){f.err=`Enter between ₹1 and ${rs(d.left)}.`;render();return}
    const ts=nowMs(),date=today();d.left=Math.max(0,d.left-a);d.settled.push({ts,date,amount:a,method:d.dir==="out"?f.method:"in"});
    if(d.dir==="in")S.mods.push({id:uid(),ts,date,amount:a,kind:"settle",ref:d.id,note:`Paid back: ${d.person}`});
    save();sheet=null;toast(d.dir==="in"?`${rs(a)} back. Added to your limit.`:`${rs(a)} paid back.`);render()},
  openMonth:()=>{F.mform={balance:"",savings:String(S.savings),err:""};modal={type:"month"};render()},
  closeModal:()=>{modal=null;render()},
  saveMonth:()=>{const f=F.mform,b=num(f.balance),sv=num(f.savings);
    if(!(b>=0)||f.balance===""){f.err="Enter your balance.";render();return}
    if(!(sv>=0)){f.err="Savings must be 0 or more.";render();return}
    const fixed=sum(S.fixed,x=>x.amount);if(b-fixed-sv<=0){f.err=`Fixed (${rs(fixed)}) + savings (${rs(sv)}) is more than your balance. Lower your savings.`;render();return}
    const t=today();S.months[mkey(t)]=mkMonth(b,sv,t);modal=null;save();invalidate();toast(`${rs(dayInfo(t).base)} a day. Stay inside it.`);render()},
  sNext:()=>setupStep(1),sBack:()=>setupStep(-1),
  sfAdd:()=>{F.setup.fixed.push({name:"",amount:""});render()},sfDel:el=>{F.setup.fixed.splice(+el.dataset.i,1);render()},
  scAdd:()=>{F.setup.cats.push({name:"",cap:""});render()},scDel:el=>{F.setup.cats.splice(+el.dataset.i,1);render()},
  reviewCheck:()=>{const f=F.rev,u=num(f.upi);if(!(u>=0)||f.upi===""){f.err="Enter the UPI total (0 is fine, if it's true).";render();return}f.err="";f.checked=true;render()},
  reviewAck:el=>{const ws=el.dataset.ws,r=reviewData(ws),u=num(F.rev.upi),gap=u-r.upiLogged;
    if(gap>0.5)S.shame.push({id:uid(),ts:nowMs(),date:r.we<today()?r.we:today(),type:"untracked",amount:gap,note:`Untracked UPI, ${short(r.ws)}–${short(r.we)}`});
    S.reviews[ws]={ts:nowMs(),upi:u,logged:r.upiLogged,untracked:Math.max(0,gap)};
    for(let k=addDays(ws,-7),i=0;i<8&&addDays(k,6)>=S.firstDay;i++,k=addDays(k,-7)){if(!S.reviews[k]){S.reviews[k]={skipped:true,ts:nowMs()};S.shame.push({id:uid(),ts:nowMs(),date:addDays(k,6),type:"skipped",amount:0,note:`Skipped review: week of ${short(k)}`})}}
    F.rev={upi:"",checked:false,err:""};save();toast("Review done. See you next week.");render();window.scrollTo(0,0)},
  saveGoal:()=>{const f=F.goalf,g=S.goal,name=f.name.trim()||(g&&g.name)||"",t=f.target===""?(g&&g.target):num(f.target);
    if(!name){f.err="Enter a name.";render();return}if(!(t>0)){f.err="Enter a valid target.";render();return}
    if(g&&g.saved>=g.target){S.goalsDone.push({name:g.name,target:g.target,ts:nowMs()});S.goal={name,target:t,saved:Math.max(0,g.saved-g.target)}}
    else S.goal={name,target:t,saved:g?g.saved:0};
    F.goalf={name:"",target:"",err:""};save();toast("Goal set.");render()},
  balOpen:()=>{const m=S.months[mkey(today())];F.balf={balance:String(m.balance),savings:String(m.savings),err:"",open:true};render()},
  balCancel:()=>{F.balf.open=false;render()},
  saveBal:()=>{const f=F.balf,mk=mkey(today()),m=S.months[mk],b=num(f.balance),sv=num(f.savings);
    if(!(b>=0)||f.balance===""){f.err="Enter your balance.";render();return}
    if(!(sv>=0)){f.err="Savings must be 0 or more.";render();return}
    const sp=b-m.fixedTotal-sv;if(sp<=0){f.err=`Fixed (${rs(m.fixedTotal)}) + savings (${rs(sv)}) is more than this balance. Lower your savings.`;render();return}
    if(b===m.balance&&sv===m.savings){f.open=false;render();return}
    const parts=[];if(b!==m.balance)parts.push(`balance ${rs(m.balance)} → ${rs(b)}`);if(sv!==m.savings)parts.push(`savings ${rs(m.savings)} → ${rs(sv)}`);
    S.mods.push({id:uid(),ts:nowMs(),date:today(),amount:0,kind:"balance",from:m.spendable,to:sp,note:"Corrected "+parts.join(", ")});
    m.balance=b;m.savings=sv;m.spendable=sp;m.base0=sp/m.days;
    F.balf={balance:"",savings:"",err:"",open:false};save();invalidate();toast(`Updated. Now ${rs(dayInfo(today())?.base)} a day.`);render()},
  adjSign:el=>{F.adj.sign=el.dataset.v;render()},
  saveAdj:()=>{const f=F.adj,a=num(f.amount);if(!(a>0)){f.err="Enter an amount.";render();return}if(f.reason.trim().length<3){f.err="Write why you're changing it.";render();return}
    const amt=f.sign==="+"?a:-a;S.mods.push({id:uid(),ts:nowMs(),date:today(),amount:amt,kind:"adjust",note:f.reason.trim()});
    F.adj={sign:"+",amount:"",reason:"",err:""};save();invalidate();toast(`Budget changed. Now ${rs(dayInfo(today())?.base)} a day. Logged.`);render()},
  addCat:()=>{const f=F.catf;if(!f.name.trim()){f.err="Enter a name.";render();return}const cap=f.cap===""?0:num(f.cap);if(!(cap>=0)){f.err="Enter a valid cap.";render();return}
    S.categories.push({id:uid(),name:f.name.trim(),cap});F.catf={name:"",cap:"",err:""};save();render()},
  delCat:el=>{if(S.categories.length<=1){toast("You need at least one category.");return}S.categories=S.categories.filter(c=>c.id!==el.dataset.id);delete S.locks[el.dataset.id];save();render()},
  addFix:()=>{const f=F.fixf,a=num(f.amount);if(!f.name.trim()||!(a>0)){f.err="Enter both a name and an amount.";render();return}S.fixed.push({id:uid(),name:f.name.trim(),amount:a});F.fixf={name:"",amount:"",err:""};save();render()},
  delFix:el=>{S.fixed=S.fixed.filter(x=>x.id!==el.dataset.id);save();render()},
  exportData,copyExport:()=>{const t=$("#exptext");if(!t)return;const v=t.value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Copied.")).catch(()=>{t.select();toast("Selected. Copy it.")})},
  doImport:()=>{try{S=Object.assign(fresh(),pendingImport);pendingImport=null;save();sheet=null;invalidate();toast("Imported.");render()}catch(e){toast("Import failed.")}},
  doReset:()=>{if(F.reset.typed.trim().toUpperCase()!=="DELETE"){toast("Type: DELETE");return}S=fresh();save();sheet=null;F.setup=null;go("home")},
  pushToggle:()=>{S.settings.pushOn?disablePush():enablePush()},
  pushTest:()=>pushCall("/test").then(()=>pmsg("Test sent. It should arrive within a minute.")).catch(e=>pmsg("Fail: "+e.message)),
};
function setupStep(dir){
  const s=F.setup;s.err="";
  if(dir>0){
    if(s.step===1&&!(num(s.balance)>0))s.err="Enter your balance.";
    if(s.step===2&&s.fixed.some(f=>f.name.trim()&&f.amount!==""&&!(num(f.amount)>=0)))s.err="Enter a valid amount.";
    if(s.step===3){if(!s.goalName.trim())s.err="Name your goal. You must want something.";else if(!(num(s.goalTarget)>0))s.err="Enter the goal amount.";else if(!(num(s.savings)>=0))s.err="Enter savings (0 is fine).";}
    if(s.step===4){const ok=s.cats.filter(c=>c.name.trim());if(!ok.length)s.err="At least one category.";else if(ok.some(c=>c.cap!==""&&!(num(c.cap)>=0)))s.err="Enter a valid cap.";}
    if(s.step===5){if(!(num(s.foodDay)>0))s.err="Enter your food cost.";else if(!(num(s.wishMin)>0))s.err="Enter the waiting list amount.";else if(!/^\d\d:\d\d$/.test(s.remindAt))s.err="Enter a valid time.";}
    if(s.step===6){const c=setupCalc();if(c.spend<=0){s.err="Fixed costs + savings are more than your balance. Go back and lower your savings.";render();return}finishSetup();return}
    if(s.err){render();return}
  }
  s.step=Math.max(0,Math.min(6,s.step+dir));render();window.scrollTo(0,0);
}
function finishSetup(){
  const s=F.setup,t=today();
  S=fresh();S.setup=true;S.firstDay=t;
  S.fixed=s.fixed.filter(f=>f.name.trim()&&num(f.amount)>0).map(f=>({id:uid(),name:f.name.trim(),amount:num(f.amount)}));
  S.savings=num(s.savings)||0;S.goal={name:s.goalName.trim(),target:num(s.goalTarget),saved:0};
  S.categories=s.cats.filter(c=>c.name.trim()).map(c=>({id:uid(),name:c.name.trim(),cap:c.cap===""?0:num(c.cap)}));
  S.settings.foodDay=num(s.foodDay);S.settings.wishMin=num(s.wishMin);S.settings.remindAt=s.remindAt;
  S.months[mkey(t)]=mkMonth(num(s.balance),S.savings,t);
  save();F.setup=null;toast("Started. Your daily limit is at the top.");go("home");
}

/* backup */
let pendingImport=null;
async function exportData(){
  const txt=JSON.stringify(S,null,1),name=`uda-le-backup-${today()}.json`;
  try{const file=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Uda le backup"});toast("Backup ready. Pick Files/iCloud.");return}}catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
  F.imp.text=txt;render();
}
function importFile(input){
  const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.entries))throw 0;pendingImport=d;F.imp.err="";sheet={type:"import",count:d.entries.length};render()}catch(e){F.imp.err="That doesn't look like an Uda le backup.";render()}};
  r.readAsText(f);input.value="";
}

/* push */
function pmsg(m){const el=$("#pushmsg");if(el)el.textContent=m;else toast(m)}
function b64u(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function srv(){return (S.settings.server||"").trim().replace(/\/+$/,"")}
async function pushCall(path,body){
  const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
  if(!sub)throw new Error("no subscription");
  const r=await fetch(srv()+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({sub:sub.toJSON(),at:S.settings.remindAt,tz:Intl.DateTimeFormat().resolvedOptions().timeZone},body||{}))});
  if(!r.ok)throw new Error("server "+r.status);return r;
}
async function enablePush(){
  try{
    if(!srv()||!/^https:\/\//.test(srv())){pmsg("Enter the server URL first (https://...).");return}
    const perm=await Notification.requestPermission();if(perm!=="granted"){pmsg("Notifications not allowed. iPhone Settings → Uda le → Notifications.");return}
    pmsg("Connecting...");
    const kr=await fetch(srv()+"/vapid");if(!kr.ok)throw new Error("server "+kr.status);const {key}=await kr.json();
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(sub){const cur=sub.options&&sub.options.applicationServerKey;const same=cur&&btoa(String.fromCharCode(...new Uint8Array(cur))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")===key;if(!same){await sub.unsubscribe();sub=null}}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    await pushCall("/subscribe");S.settings.pushOn=true;save();render();toast(`Reminders on. Daily at ${S.settings.remindAt} and Sunday 20:00.`);
  }catch(e){pmsg("Failed: "+e.message+". Check the URL.")}
}
async function disablePush(){
  try{await pushCall("/unsubscribe");const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}
  S.settings.pushOn=false;save();render();toast("Reminders off.");
}

/* ============ events ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.dataset.hold)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);return}
  if(t.dataset.bindcheck){setPath(t.dataset.bindcheck,t.checked);return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.actChange==="importFile"){importFile(t);return}
  if(t.dataset.catname){const c=cat(t.dataset.catname);if(c&&t.value.trim()){c.name=t.value.trim();save()}else render();return}
  if(t.dataset.catcap){const c=cat(t.dataset.catcap),v=t.value===""?0:num(t.value);if(c&&v>=0){c.cap=v;invalidate();recheckLock(c.id);save()}render();return}
  if(t.dataset.fixname){const f=S.fixed.find(x=>x.id===t.dataset.fixname);if(f&&t.value.trim()){f.name=t.value.trim();save()}return}
  if(t.dataset.fixamt){const f=S.fixed.find(x=>x.id===t.dataset.fixamt),v=num(t.value);if(f&&v>0){f.amount=v;save()}else render();return}
  if(t.dataset.setnum){const v=num(t.value),ks=t.dataset.setnum.split(".");if(v>=0&&(ks[1]!=="foodDay"||v>0)){if(ks.length===1)S[ks[0]]=v;else S[ks[0]][ks[1]]=v;save();toast("Saved.")}else render();return}
  if(t.dataset.setstr){const ks=t.dataset.setstr.split(".");S[ks[0]][ks[1]]=t.value.trim();save();
    if(ks[1]==="remindAt"&&S.settings.pushOn)pushCall("/subscribe").then(()=>pmsg("Time updated: "+S.settings.remindAt)).catch(()=>pmsg("Couldn't update the time on the server."));return}
});
// hold-to-confirm
let holdT=null,holdStart=0,holdEl=null;
const HOLD_MS=1500;
function holdBegin(el){holdEl=el;holdStart=performance.now();const tick=()=>{if(!holdEl)return;const p=Math.min(1,(performance.now()-holdStart)/HOLD_MS);holdEl.style.setProperty("--p",p);if(p>=1){const a=holdEl.dataset.hold;holdEnd();A[a]&&A[a]();return}holdT=requestAnimationFrame(tick)};holdT=requestAnimationFrame(tick)}
function holdEnd(){cancelAnimationFrame(holdT);if(holdEl)holdEl.style.setProperty("--p",0);holdEl=null}
document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-hold]");if(el){e.preventDefault();holdBegin(el)}});
["pointerup","pointercancel"].forEach(n=>document.addEventListener(n,()=>{if(holdEl)holdEnd()}));
document.addEventListener("keydown",e=>{const rb=e.target.closest&&e.target.closest('[role="button"][data-act]');if(rb&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const d=rb.dataset.d;A[rb.dataset.act](rb);const n=d&&document.querySelector(`[data-d="${d}"]`);n&&n.focus();return}
  const el=document.activeElement;if(el&&el.dataset&&el.dataset.hold&&(e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();holdBegin(el)}
  if(e.key==="Escape"&&sheet){sheet=null;render()}});
document.addEventListener("keyup",e=>{if(holdEl&&(e.key===" "||e.key==="Enter"))holdEnd()});
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-hold]"))e.preventDefault()});
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(["home","spend","shame","rules"].includes(r)&&r!==route){route=r;render()}});
// re-evaluate when app comes back (new day, Sunday night, 24h wishlist)
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.activeElement.matches("input,textarea"))render()});
setInterval(()=>{if(!document.hidden&&!document.activeElement.matches("input,textarea"))render()},60000);
window.addEventListener("storage",e=>{if(e.key===KEY){S=load()||fresh();render()}});

if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
render();
</script>
